[project]
name = "top-evals"
version = "0.1.0"
description = "Track the hottest open-weight models and their evals."
readme = "README.md"
authors = [
    { name = "Ben Lambert", email = "blambert@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "typer>=0.27.3",
]

[project.scripts]
top-evals = "top_evals.cli:app"

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.0",
    "isort>=9.0.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.isort]
profile = "black"

[tool.mypy]
strict = true
